repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
    -   id: ruff-check
        args: [--fix]
        files: ^src/
    # occasional full lint including tests: pre-commit run ruff-check-tests --hook-stage manual --all-files
    -   id: ruff-check
        alias: ruff-check-tests
        name: ruff check (including tests)
        args: [--fix, --config, "lint.exclude = []"]
        files: ^src/
        stages: [manual]
    -   id: ruff-format
        files: ^src/
